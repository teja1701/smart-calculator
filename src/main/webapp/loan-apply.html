<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meridian Retail Bank - Loan Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Meridian Retail Bank</h1>
</header>
<nav>
    <ul>
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="#">Accounts</a></li>
        <li><a href="#">Transfers</a></li>
        <li><a href="loan-apply.html">Loans</a></li>
        <li><a href="#">Settings</a></li>
    </ul>
</nav>
<main>
    <section>
        <h2>Loan Application Form</h2>
        <form>
            <div>
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" minlength="3" required>
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" title="10-digit mobile number" required>
            </div>

            <div>
                <label for="loanType">Loan Type:</label>
                <select id="loanType" name="loanType" required>
                    <option value="">Select Loan Type</option>
                    <option value="Home Loan">Home Loan</option>
                    <option value="Personal Loan">Personal Loan</option>
                    <option value="Education Loan">Education Loan</option>
                </select>
            </div>

            <div>
                <label for="loanAmount">Loan Amount:</label>
                <input type="number" id="loanAmount" name="loanAmount" min="50000" max="5000000" step="1000" required>
            </div>

            <div>
                <label for="annualIncome">Annual Income:</label>
                <input type="number" id="annualIncome" name="annualIncome" min="100000" required>
            </div>

            <div class="checkbox-container">
                <input type="checkbox" id="declaration" name="declaration" required>
                <label for="declaration">I confirm the information provided is accurate</label>
            </div>

            <button type="submit">Submit Application</button>
        </form>
    </section>
</main>
<footer>
    <p>&copy; 2025 Meridian Retail Bank | Savoira Learning Platform | <a href="#">Privacy Policy</a></p>
</footer>
</body>
</html>
